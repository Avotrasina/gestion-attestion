<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEM — Gestion des attestations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cem: { red: '#E30613', dark: '#2D2D2D', light: '#F6F6F8' }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="text-center p-8">
    <img src="assets/logo.jpg" alt="Caisse d'Epargne Madagascar" class="h-14 mx-auto mb-6 object-contain"
         onerror="this.onerror=null;this.src='https://sc04.alicdn.com/kf/Sd4033d7e084746d289d4d1e9ddc77d7ar.jpg'">
    <div class="w-10 h-10 border-4 border-cem-red border-t-transparent rounded-full animate-spin mx-auto"></div>
    <p class="mt-4 text-sm text-gray-500">Redirection en cours…</p>
  </div>
  <script>
    authEnsureDemoUser();
    window.location.replace(authIsAuthenticated() ? "dashboard.html" : "login.html");
  </script>
</body>
</html>
