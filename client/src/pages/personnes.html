<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personnes — CEM Gestion des attestations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cem: { red: '#E30613', dark: '#2D2D2D', light: '#F6F6F8' }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .champ {
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      font-size: 0.875rem;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .champ:focus {
      border-color: #E30613;
      box-shadow: 0 0 0 2px rgba(227, 6, 19, .25);
    }
  </style>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/commun.js"></script>
</head>
<body>

  <div id="contenu" class="p-4 md:p-6 space-y-4">

    <!-- Barre d'actions -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-gray-600">
        <span id="compte-personnes" class="font-bold text-cem-dark">0</span> personne(s) affichée(s)
      </p>
      <button onclick="ouvrirAjout()"
              class="inline-flex items-center gap-2 bg-cem-red hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 4v16m8-8H4"/></svg>
        Nouvelle personne
      </button>
    </div>

    <!-- Filtres -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Type</label>
          <select id="filtre-type" class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-white text-sm focus:ring-2 focus:ring-cem-red/30 focus:border-cem-red outline-none">
            <option value="">Tous</option>
            <option value="ETUDIANT">Étudiant</option>
            <option value="PERSONNEL">Personnel</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Unité / Agence</label>
          <select id="filtre-unite" class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-white text-sm focus:ring-2 focus:ring-cem-red/30 focus:border-cem-red outline-none">
            <option value="">Toutes</option>
          </select>
        </div>
        <div class="col-span-2 md:col-span-2">
          <label class="block text-xs font-semibold text-gray-500 mb-1">Recherche</label>
          <input type="text" id="filtre-recherche" placeholder="Nom, prénom, e-mail, matricule…"
                 class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-cem-red/30 focus:border-cem-red outline-none">
        </div>
      </div>
      <div class="mt-3 flex justify-end">
        <button id="btn-reinitialiser"
                class="inline-flex items-center gap-2 text-sm font-semibold text-gray-500 hover:text-cem-red px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Réinitialiser
        </button>
      </div>
    </div>

    <!-- Tableau -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-100 text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Personne</th>
              <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Type</th>
              <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Détail</th>
              <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Contact</th>
              <th class="px-5 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody id="lignes-personnes" class="divide-y divide-gray-50">
            <tr><td colspan="5" class="px-5 py-10 text-center text-gray-400">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===================== MODALE : AJOUT / ÉDITION ===================== -->
  <div id="modal-personne" class="modal-overlay hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h3 class="font-bold text-cem-dark" id="modal-titre">Nouvelle personne</h3>
        <button onclick="closeModal('modal-personne')" class="text-gray-400 hover:text-cem-red">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-personne" class="overflow-y-auto p-6 space-y-4">
        <input type="hidden" id="id_personne">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Type de personne *</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="carte-type flex items-center gap-3 border-2 rounded-lg px-4 py-3 cursor-pointer transition-all" style="border-color:#E30613">
              <input type="radio" name="type" value="ETUDIANT" class="accent-[#E30613]" checked>
              <span>
                <span class="block text-sm font-semibold text-cem-dark">Étudiant</span>
                <span class="block text-xs text-gray-500">Stagiaire</span>
              </span>
            </label>
            <label class="carte-type flex items-center gap-3 border-2 rounded-lg px-4 py-3 cursor-pointer transition-all"
                   style="border-color:#e5e7eb">
              <input type="radio" name="type" value="PERSONNEL" class="accent-[#E30613]">
              <span>
                <span class="block text-sm font-semibold text-cem-dark">Personnel</span>
                <span class="block text-xs text-gray-500">Employé de la CEM</span>
              </span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="p-nom" class="block text-sm font-semibold text-gray-700 mb-1.5">Nom *</label>
            <input type="text" id="p-nom" class="champ" placeholder="Rakoto">
          </div>
          <div>
            <label for="p-prenom" class="block text-sm font-semibold text-gray-700 mb-1.5">Prénom *</label>
            <input type="text" id="p-prenom" class="champ" placeholder="Hery">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="p-email" class="block text-sm font-semibold text-gray-700 mb-1.5">E-mail *</label>
            <input type="email" id="p-email" class="champ" placeholder="hery.rakoto@cem.mg">
          </div>
          <div>
            <label for="p-telephone" class="block text-sm font-semibold text-gray-700 mb-1.5">Téléphone * (10 chiffres)</label>
            <input type="tel" id="p-telephone" class="champ" placeholder="0321234567" maxlength="10">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="p-sexe" class="block text-sm font-semibold text-gray-700 mb-1.5">Sexe *</label>
            <select id="p-sexe" class="champ">
              <option value="H">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>
          <div>
            <label for="p-unite" class="block text-sm font-semibold text-gray-700 mb-1.5">Unité / Agence</label>
            <select id="p-unite" class="champ"><option value="">— Sélectionner —</option></select>
          </div>
        </div>

        <!-- Champs étudiant -->
        <div id="p-champs-etudiant" class="grid grid-cols-3 gap-4 border-t border-gray-100 pt-4">
          <div class="col-span-3 md:col-span-1">
            <label for="p-universite" class="block text-sm font-semibold text-gray-700 mb-1.5">Université *</label>
            <input type="text" id="p-universite" class="champ" placeholder="Université d'Antananarivo">
          </div>
          <div class="col-span-3 md:col-span-1">
            <label for="p-annee" class="block text-sm font-semibold text-gray-700 mb-1.5">Année d'étude *</label>
            <input type="number" id="p-annee" class="champ" min="1" max="10" placeholder="3">
          </div>
          <div class="col-span-3 md:col-span-1">
            <label for="p-filiere" class="block text-sm font-semibold text-gray-700 mb-1.5">Filière *</label>
            <input type="text" id="p-filiere" class="champ" placeholder="Informatique">
          </div>
        </div>

        <!-- Champs personnel -->
        <div id="p-champs-personnel" class="hidden grid grid-cols-2 gap-4 border-t border-gray-100 pt-4">
          <div>
            <label for="p-matricule" class="block text-sm font-semibold text-gray-700 mb-1.5">Matricule *</label>
            <input type="text" id="p-matricule" class="champ" placeholder="CEM-2024-001">
          </div>
          <div>
            <label for="p-date-entree" class="block text-sm font-semibold text-gray-700 mb-1.5">Date d'entrée *</label>
            <input type="date" id="p-date-entree" class="champ">
          </div>
          <div>
            <label for="p-contrat" class="block text-sm font-semibold text-gray-700 mb-1.5">Type de contrat *</label>
            <select id="p-contrat" class="champ">
              <option value="">— Choisir —</option>
              <option value="CDI">CDI</option>
              <option value="CDD">CDD</option>
              <option value="Stage">Stage</option>
              <option value="Consultant">Consultant / Prestataire</option>
              <option value="Autre">Autre</option>
            </select>
          </div>
          <div>
            <label for="p-categorie" class="block text-sm font-semibold text-gray-700 mb-1.5">Catégorie *</label>
            <input type="text" id="p-categorie" class="champ" placeholder="A, B, C…">
          </div>
          <div class="col-span-2">
            <label for="p-fonction" class="block text-sm font-semibold text-gray-700 mb-1.5">Fonction *</label>
            <select id="p-fonction" class="champ"><option value="">— Sélectionner —</option></select>
          </div>
        </div>

        <p id="p-erreur" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('modal-personne')"
                  class="px-4 py-2 rounded-lg border border-gray-300 text-sm font-semibold text-gray-700 hover:bg-gray-50">Annuler</button>
          <button type="submit" id="p-submit"
                  class="px-5 py-2 rounded-lg bg-cem-red hover:bg-red-700 text-white text-sm font-semibold transition-colors">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    authRequireAuth();
    initLayout({
      active: "personnes",
      titre: "Personnes",
      sousTitre: "Étudiants et personnels enregistrés",
    });

    let personnes = [];
    let unites = [];
    let fonctions = [];

    async function chargerReferences() {
      const [resUnites, resFonctions] = await Promise.all([
        apiGet("/unites"),
        apiGet("/fonctions"),
      ]);
      unites = resUnites.data || [];
      fonctions = resFonctions.data || [];

      const uniteSelects = [document.getElementById("filtre-unite"), document.getElementById("p-unite")];
      uniteSelects.forEach((sel) => {
        unites.forEach((u) => {
          const opt = document.createElement("option");
          opt.value = u.id_unite;
          opt.textContent = u.nom + " (" + u.code + ")";
          sel.appendChild(opt);
        });
      });
      const fonctionSelect = document.getElementById("p-fonction");
      fonctions.forEach((f) => {
        const opt = document.createElement("option");
        opt.value = f.id_fonction;
        opt.textContent = f.nom_fonction;
        fonctionSelect.appendChild(opt);
      });
    }

    async function chargerPersonnes() {
      try {
        const res = await apiGet("/personnes");
        personnes = res.data || [];
        appliquerFiltres();
      } catch (err) {
        document.getElementById("lignes-personnes").innerHTML =
          `<tr><td colspan="5" class="px-5 py-10 text-center text-red-500">${escapeHtml(err.message)}</td></tr>`;
        showToast(err.message, "error");
      }
    }

    function appliquerFiltres() {
      const type = document.getElementById("filtre-type").value;
      const unite = document.getElementById("filtre-unite").value;
      const recherche = document.getElementById("filtre-recherche").value.trim().toLowerCase();

      let resultats = personnes.filter((p) => {
        if (type === "ETUDIANT" && !p.etudiant) return false;
        if (type === "PERSONNEL" && !p.personnel) return false;
        if (unite && String(p.id_unite) !== unite) return false;
        if (recherche) {
          const texte = [
            p.nom, p.prenom, p.email, p.telephone,
            p.etudiant ? p.etudiant.universite + " " + p.etudiant.filiere : "",
            p.personnel ? p.personnel.matricule : "",
          ].join(" ").toLowerCase();
          if (!texte.includes(recherche)) return false;
        }
        return true;
      });

      document.getElementById("compte-personnes").textContent = resultats.length;
      rendreTableau(resultats);
    }

    function rendreTableau(liste) {
      const tbody = document.getElementById("lignes-personnes");
      if (liste.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-10 text-center text-gray-400">Aucune personne ne correspond aux filtres.</td></tr>`;
        return;
      }

      tbody.innerHTML = liste.map((p) => {
        const estEtudiant = !!p.etudiant;
        const detail = estEtudiant
          ? escapeHtml(p.etudiant.filiere) + " — " + escapeHtml(p.etudiant.universite) + " (L" + (p.etudiant.annee_etude || "?") + ")"
          : (p.personnel.fonction ? escapeHtml(p.personnel.fonction.nom_fonction) : "—") +
            " · " + escapeHtml(p.personnel.matricule) +
            " · " + escapeHtml(p.personnel.categorie);
        const unite = unites.find((u) => u.id_unite === p.id_unite);

        return `
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-5 py-3">
            <p class="font-medium text-cem-dark">${escapeHtml(nomComplet(p))}</p>
            <p class="text-xs text-gray-400">${escapeHtml(p.email)}</p>
          </td>
          <td class="px-5 py-3">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${
              estEtudiant ? "bg-violet-50 text-violet-700 ring-1 ring-violet-200" : "bg-sky-50 text-sky-700 ring-1 ring-sky-200"
            }">${estEtudiant ? "Étudiant" : "Personnel"}</span>
          </td>
          <td class="px-5 py-3 text-gray-600">${detail}</td>
          <td class="px-5 py-3 text-gray-600">
            <p>${escapeHtml(p.telephone)}</p>
            <p class="text-xs text-gray-400">${unite ? escapeHtml(unite.nom) : "—"}</p>
          </td>
          <td class="px-5 py-3">
            <div class="flex items-center justify-end gap-1">
              <button onclick="ouvrirEdition(${p.id_personne})" title="Modifier"
                      class="p-2 rounded-lg text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button onclick="supprimerPersonne(${p.id_personne})" title="Supprimer"
                      class="p-2 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>`;
      }).join("");
    }

    /* ---------- Modal ajout / édition ---------- */

    function basculerTypeModal(type) {
      const etudiant = type === "ETUDIANT";
      document.getElementById("p-champs-etudiant").classList.toggle("hidden", !etudiant);
      document.getElementById("p-champs-personnel").classList.toggle("hidden", etudiant);
      document.getElementById("p-champs-personnel").classList.toggle("grid", !etudiant);
      document.querySelectorAll("#form-personne input[name='type']").forEach((r) => {
        r.checked = r.value === type;
      });
      document.querySelectorAll("#form-personne .carte-type").forEach((c) => {
        c.style.borderColor = c.querySelector("input").checked ? "#E30613" : "#e5e7eb";
      });
    }

    document.querySelectorAll("#form-personne input[name='type']").forEach((r) => {
      r.addEventListener("change", () => basculerTypeModal(r.value));
    });

    function ouvrirAjout() {
      document.getElementById("modal-titre").textContent = "Nouvelle personne";
      document.getElementById("form-personne").reset();
      document.getElementById("id_personne").value = "";
      document.getElementById("p-erreur").classList.add("hidden");
      basculerTypeModal("ETUDIANT");
      openModal("modal-personne");
    }

    function ouvrirEdition(id) {
      const p = personnes.find((x) => x.id_personne === id);
      if (!p) return;
      const estEtudiant = !!p.etudiant;

      document.getElementById("modal-titre").textContent = "Modifier la personne";
      document.getElementById("id_personne").value = p.id_personne;
      document.getElementById("p-nom").value = p.nom || "";
      document.getElementById("p-prenom").value = p.prenom || "";
      document.getElementById("p-email").value = p.email || "";
      document.getElementById("p-telephone").value = p.telephone || "";
      document.getElementById("p-sexe").value = p.sexe || "H";
      document.getElementById("p-unite").value = p.id_unite || "";
      document.getElementById("p-erreur").classList.add("hidden");

      basculerTypeModal(estEtudiant ? "ETUDIANT" : "PERSONNEL");
      if (estEtudiant) {
        document.getElementById("p-universite").value = p.etudiant.universite || "";
        document.getElementById("p-annee").value = p.etudiant.annee_etude || "";
        document.getElementById("p-filiere").value = p.etudiant.filiere || "";
      } else {
        document.getElementById("p-matricule").value = p.personnel.matricule || "";
        document.getElementById("p-date-entree").value = p.personnel.date_entree ? p.personnel.date_entree.slice(0, 10) : "";
        document.getElementById("p-contrat").value = p.personnel.contrat || "";
        document.getElementById("p-categorie").value = p.personnel.categorie || "";
        document.getElementById("p-fonction").value = p.personnel.id_fonction || "";
      }
      openModal("modal-personne");
    }

    function validerFormulaire() {
      const nom = document.getElementById("p-nom").value.trim();
      const prenom = document.getElementById("p-prenom").value.trim();
      const email = document.getElementById("p-email").value.trim();
      const telephone = document.getElementById("p-telephone").value.trim();
      if (!nom || !prenom || !email || !telephone) return "Tous les champs obligatoires doivent être renseignés.";
      if (!telephoneValide(telephone)) return "Le téléphone doit contenir exactement 10 chiffres.";

      const type = document.querySelector("#form-personne input[name='type']:checked").value;
      if (type === "ETUDIANT") {
        if (!document.getElementById("p-universite").value.trim() ||
            !document.getElementById("p-annee").value ||
            !document.getElementById("p-filiere").value.trim()) {
          return "Veuillez renseigner les informations de l'étudiant (université, année, filière).";
        }
      } else {
        if (!document.getElementById("p-matricule").value.trim() ||
            !document.getElementById("p-date-entree").value ||
            !document.getElementById("p-contrat").value ||
            !document.getElementById("p-categorie").value.trim() ||
            !document.getElementById("p-fonction").value) {
          return "Veuillez renseigner les informations du personnel (matricule, date d'entrée, contrat, catégorie, fonction).";
        }
      }
      return null;
    }

    document.getElementById("form-personne").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("p-erreur");
      errEl.classList.add("hidden");

      const erreur = validerFormulaire();
      if (erreur) {
        errEl.textContent = erreur;
        errEl.classList.remove("hidden");
        return;
      }

      const id = document.getElementById("id_personne").value;
      const type = document.querySelector("#form-personne input[name='type']:checked").value;

      const payload = {
        nom: document.getElementById("p-nom").value.trim(),
        prenom: document.getElementById("p-prenom").value.trim(),
        email: document.getElementById("p-email").value.trim(),
        telephone: document.getElementById("p-telephone").value.trim(),
        sexe: document.getElementById("p-sexe").value,
        id_unite: document.getElementById("p-unite").value ? Number(document.getElementById("p-unite").value) : null,
      };
      if (type === "ETUDIANT") {
        payload.type = "ETUDIANT";
        payload.etudiant = {
          universite: document.getElementById("p-universite").value.trim(),
          annee_etude: Number(document.getElementById("p-annee").value),
          filiere: document.getElementById("p-filiere").value.trim(),
        };
      } else {
        payload.type = "PERSONNEL";
        payload.personnel = {
          matricule: document.getElementById("p-matricule").value.trim(),
          date_entree: document.getElementById("p-date-entree").value,
          contrat: document.getElementById("p-contrat").value,
          categorie: document.getElementById("p-categorie").value.trim(),
          id_fonction: Number(document.getElementById("p-fonction").value),
        };
      }

      const btn = document.getElementById("p-submit");
      btn.disabled = true;
      btn.textContent = "Enregistrement…";

      try {
        if (id) {
          await apiPut("/personnes/" + id, payload);
          showToast("Personne modifiée avec succès.", "success");
        } else {
          await apiPost("/personnes", payload);
          showToast("Personne créée avec succès.", "success");
        }
        closeModal("modal-personne");
        await chargerPersonnes();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Enregistrer";
      }
    });

    async function supprimerPersonne(id) {
      if (!confirm("Voulez-vous vraiment supprimer cette personne ?")) return;
      try {
        await apiDelete("/personnes/" + id);
        showToast("Personne supprimée avec succès.", "success");
        await chargerPersonnes();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    /* ---------- Filtres ---------- */
    ["filtre-type", "filtre-unite", "filtre-recherche"].forEach((id) => {
      document.getElementById(id).addEventListener("input", appliquerFiltres);
      document.getElementById(id).addEventListener("change", appliquerFiltres);
    });
    document.getElementById("btn-reinitialiser").addEventListener("click", () => {
      document.getElementById("filtre-type").value = "";
      document.getElementById("filtre-unite").value = "";
      document.getElementById("filtre-recherche").value = "";
      appliquerFiltres();
    });

    chargerReferences().then(chargerPersonnes).catch((err) => showToast(err.message, "error"));
  </script>
</body>
</html>
